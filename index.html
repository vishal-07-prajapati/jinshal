<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2a1418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Jinshal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <nav id="nav" class="nav" hidden>
    <a href="#/story" data-tab="story"><span aria-hidden="true">♥</span>Our Story</a>
    <a href="#/albums" data-tab="albums"><span aria-hidden="true">▦</span>Albums</a>
    <button type="button" id="logout"><span aria-hidden="true">⏻</span>Log out</button>
  </nav>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lb-bar">
      <button type="button" class="icon-btn" data-lb="close" aria-label="Close">✕</button>
      <div class="lb-meta"><span id="lb-count"></span><small id="lb-date"></small></div>
      <a class="icon-btn" id="lb-download" aria-label="Download photo" download>⤓</a>
    </div>
    <div class="lb-stage" id="lb-stage">
      <img id="lb-img" alt="">
      <div class="spinner" id="lb-spin"></div>
    </div>
    <button type="button" class="lb-arrow prev" data-lb="prev" aria-label="Previous">‹</button>
    <button type="button" class="lb-arrow next" data-lb="next" aria-label="Next">›</button>
  </div>

  <div id="hearts" class="hearts" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
